[project]
name = "github-analyzer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "PyGithub>=2.3.0",
  "groq>=0.9.0",
  "supabase>=2.4.0",
  "upstash-redis>=1.1.0",
  "python-jose[cryptography]>=3.3.0",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "ruff>=0.5.0",
]
